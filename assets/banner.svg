<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    
    /* Dynamic / Animated elements */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes scan {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    
    .pulsing-node { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .floating-card { animation: float 6s infinite ease-in-out; }
    .scan-line { stroke-dasharray: 200 400; animation: scan 8s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Background Overlay -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Dynamic / Animated Background Graphs & Flows (Kept in Background / Lower Half) -->
  <g opacity="0.6">
    <!-- Animated Connecting Rays -->
    <path d="M 150 280 Q 350 220 550 280 T 950 260 T 1100 300" fill="none" stroke="url(#accentGrad)" stroke-width="3" class="scan-line" />
    <path d="M 100 310 Q 400 240 700 310 T 1150 270" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.5" />

    <!-- Animated Nodes -->
    <circle cx="150" cy="280" r="18" fill="#0284c7" class="pulsing-node" />
    <circle cx="550" cy="280" r="24" fill="#6366f1" class="pulsing-node" />
    <circle cx="950" cy="260" r="20" fill="#a855f7" class="pulsing-node" />
  </g>

  <!-- Background Decorative Pills (Subtle, Background Layer) -->
  <g class="floating-card" opacity="0.35">
    <rect x="860" y="45" width="280" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="1000" y="70" text-anchor="middle" class="badge-text" fill="#38bdf8">🔒 Well-Architected &amp; PSPM</text>
  </g>

  <!-- Foreground Main Title & Subtitle (Clear and Unobscured) -->
  <g transform="translate(60, 115)">
    <!-- Top Decorative Line -->
    <rect x="0" y="-35" width="180" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Title -->
    <text x="0" y="15" class="title">
      Awesome Cloud Architecture Review &amp; Compliance 🏗️ 🛡️
    </text>

    <!-- Subtitle -->
    <text x="0" y="55" class="subtitle">
      Curated Cloud Governance, Preventive Policy Enforcement &amp; Continuous Compliance Ecosystem
    </text>

    <!-- Category Pills in Foreground (Below text) -->
    <g transform="translate(0, 95)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="85" y="22" text-anchor="middle" class="badge-text">☁️ Multi-Cloud CSPM</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="190" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="280" y="22" text-anchor="middle" class="badge-text">🛡️ Policy Enforcement</text>

      <!-- Pill 3 -->
      <rect x="390" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="480" y="22" text-anchor="middle" class="badge-text">🔓 Open-Source Tools</text>

      <!-- Pill 4 -->
      <rect x="585" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#4ade80" stroke-width="1" />
      <text x="665" y="22" text-anchor="middle" class="badge-text">📊 Security Graph</text>
    </g>
  </g>

  <!-- Bottom Gradient Accent Bar -->
  <rect x="0" y="354" width="1200" height="6" fill="url(#accentGrad)" />
</svg>
